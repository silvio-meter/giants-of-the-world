name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Tests import .ts modules directly and rely on native type stripping.
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Data files are generated, not hand-edited
        run: |
          npm run build:data
          git diff --exit-code -- src/data \
            || (echo "::error::src/data is out of sync — run 'npm run build:data' and commit the result" && exit 1)

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.giantscodex.com

      # Both guard suites below need the app actually serving: the SEO
      # checks read rendered robots.txt/sitemap/canonical tags, and the
      # html2canvas bundle guard reads rendered <script> tags to prove the
      # chunk never loads eagerly. Start it once, before either.
      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
        env:
          NEXT_PUBLIC_SITE_URL: https://www.giantscodex.com

      # Must run after the build: these inspect .next/static and skip
      # themselves when it is absent, which is exactly what happened when
      # they sat in the Tests step above.
      - name: Bundle guards
        run: BASE=http://localhost:3000 npm run test:bundle

      - name: SEO guards
        run: BASE=http://localhost:3000 npm run test:seo
